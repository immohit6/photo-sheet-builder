<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photo Sheet Builder</title>
<meta name="theme-color" content="#1f4f9c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo Sheets">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<style>
/* Layout: one column of section cards, each with a drop zone and a grid of captioned photos; sticky bar at the bottom makes the PDF. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202e; --muted:#5d6878; --line:#d9dfe8;
  --accent:#1f4f9c; --accent-fg:#ffffff; --accent-soft:#e6eefb; --danger:#a3262a; --thumb:#e9edf3;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151d; --surface:#18202b; --fg:#e8edf4; --muted:#9aa6b6; --line:#2c3746;
  --accent:#6ea0f0; --accent-fg:#0c1626; --accent-soft:#1c2c47; --danger:#ff8a8d; --thumb:#222c39; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151d; --surface:#18202b; --fg:#e8edf4; --muted:#9aa6b6; --line:#2c3746;
  --accent:#6ea0f0; --accent-fg:#0c1626; --accent-soft:#1c2c47; --danger:#ff8a8d; --thumb:#222c39; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,label,input{touch-action:manipulation}
html,body{margin:0}
html{color-scheme:light dark;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--muted);max-width:60ch}
label.lab{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-width:0}
input[type=text]:focus-visible,button:focus-visible,.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.doc{display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.doc>div{min-width:0}
.section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.shead{display:flex;gap:10px;align-items:center}
.shead input{font-weight:600;font-size:16px}
.pill{white-space:nowrap;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.btn{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.warn{color:var(--danger)}
.btn.small{padding:4px 8px;font-size:13px;font-weight:500}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;border:2px dashed var(--line);border-radius:8px;padding:16px;color:var(--muted);cursor:pointer;transition:background .15s,border-color .15s}
.drop strong{color:var(--fg)}
.drop.over{background:var(--accent-soft);border-color:var(--accent)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;cursor:grab}
.card.dragging{opacity:.4}
.card.target{outline:2px solid var(--accent)}
.thumb{height:170px;background:var(--thumb);display:flex;align-items:center;justify-content:center}
.thumb img{max-width:100%;max-height:100%;display:block}
.cbody{padding:8px;display:flex;flex-direction:column;gap:6px}
.crow{display:flex;gap:6px;justify-content:space-between}
.hint{font-size:13px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.barin{max-width:980px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.status{color:var(--muted);min-width:0}
.status b{color:var(--fg)}
.msg{font-size:13px;color:var(--danger);min-height:1em}
.msg.ok{color:var(--muted)}
p.hint2{margin:0}
.hint2{font-size:13px;color:var(--muted)}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px}
.pinfo{min-width:0;flex:1 1 200px}
.pname{font-weight:600;overflow-wrap:anywhere}
@media (max-width:640px){
  body{font-size:16px}
  .doc{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .card{flex-direction:row;cursor:default}
  .thumb{width:96px;min-width:96px;height:auto;min-height:132px}
  .thumb img{width:100%;height:100%;object-fit:contain}
  .cbody{flex:1;min-width:0;justify-content:space-between}
  .crow{flex-wrap:wrap;gap:4px}
  .btn.small{min-height:44px;padding:6px 9px;font-size:14px}
  .btn{min-height:44px}
  .shead{flex-wrap:wrap}
  .shead input{flex:1 1 100%}
  .drop{padding:22px 16px}
  .barin{flex-wrap:nowrap}
  .barin .btn{flex:0 0 auto;padding-inline:20px}
}
@media (pointer:coarse){.hint{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div>
    <h1>Photo Sheet Builder</h1>
    <p class="lede">Drop photos into each section, write a caption under each one, then make the PDF. Four photos fit on a page, two across.</p>
  </div>

  <div class="doc">
    <div><label class="lab" for="docTitle">Sheet title</label><input type="text" id="docTitle" placeholder="e.g. Photos of us together" autocomplete="off"></div>
    <div><label class="lab" for="docSub">Subtitle</label><input type="text" id="docSub" placeholder="e.g. Names and years" autocomplete="off"></div>
    <div><label class="lab" for="docFile">PDF file name</label><input type="text" id="docFile" placeholder="Photo_Sheet" autocomplete="off"></div>
  </div>

  <div id="sections" class="wrap" style="gap:14px"></div>
  <div><button class="btn" id="addSection" type="button">Add a section</button></div>

  <section class="section" id="bundle">
    <div class="shead"><strong>Combine into one file</strong></div>
    <p class="hint2">Add other PDFs, or finish this sheet and start another. Make PDF joins everything in the order shown here.</p>
    <label class="drop">
      <strong>Add PDFs</strong><span>drop PDF files here, or tap to choose</span>
      <input type="file" id="pdfInput" accept="application/pdf,.pdf" multiple>
    </label>
    <div id="parts" class="parts"></div>
    <div><button class="btn" id="freeze" type="button">Finish this sheet and start another</button></div>
  </section>
</div>

<div class="bar">
  <div class="barin">
    <div class="status"><div id="status"></div><div id="msg" class="msg" role="status" aria-live="polite"></div></div>
    <button class="btn primary" id="make" type="button" disabled>Make PDF</button>
  </div>
</div>

<script>
(function(){
  var uid=0, nextId=function(){return 'i'+(++uid)};
  var state={
    title:'',
    subtitle:'',
    filename:'',
    parts:[],order:['live'],
    sections:[{id:nextId(),title:'',photos:[]}]
  };
  var dragging=null, busy=false;
  var $=function(id){return document.getElementById(id)};
  var msgEl=$('msg');
  function say(t,ok){msgEl.textContent=t||'';msgEl.className='msg'+(ok?' ok':'')}

  $('docTitle').value=state.title; $('docSub').value=state.subtitle; $('docFile').value=state.filename;
  $('docTitle').addEventListener('input',function(e){state.title=e.target.value});
  $('docSub').addEventListener('input',function(e){state.subtitle=e.target.value});
  $('docFile').addEventListener('input',function(e){state.filename=e.target.value});

  function findSection(id){return state.sections.filter(function(s){return s.id===id})[0]}
  function findPhoto(pid){
    for(var i=0;i<state.sections.length;i++){var s=state.sections[i];
      for(var j=0;j<s.photos.length;j++) if(s.photos[j].id===pid) return {s:s,i:j};}
    return null;
  }
  function pageCount(){
    return state.sections.reduce(function(n,s){return n+Math.ceil(s.photos.length/4)},0);
  }
  function photoCount(){return state.sections.reduce(function(n,s){return n+s.photos.length},0)}
  function livePages(){return photoCount()?pageCount():0}
  function totalPages(){return livePages()+state.parts.reduce(function(n,p){return n+p.pages},0)}
  function updateStatus(){
    var np=photoCount(), pg=totalPages(), pn=state.parts.length;
    var t='<b>'+np+'</b> photo'+(np===1?'':'s');
    if(pn) t+=' + <b>'+pn+'</b> PDF'+(pn===1?'':'s');
    t+=', <b>'+pg+'</b> page'+(pg===1?'':'s')+' in the file';
    $('status').innerHTML=t;
    $('make').disabled=busy||pg===0;
  }

  /* ---------- reading photos ---------- */
  function loadBitmap(file){
    if(window.createImageBitmap){
      return createImageBitmap(file,{imageOrientation:'from-image'}).catch(function(){return viaImg(file)});
    }
    return viaImg(file);
  }
  function viaImg(file){
    return new Promise(function(res,rej){
      var u=URL.createObjectURL(file), im=new Image();
      im.onload=function(){res(im);setTimeout(function(){URL.revokeObjectURL(u)},3000)};
      im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('decode'))};
      im.src=u;
    });
  }
  function shrink(src){
    var w=src.width||src.naturalWidth, h=src.height||src.naturalHeight, max=1600, k=Math.min(1,max/Math.max(w,h));
    var cw=Math.round(w*k), ch=Math.round(h*k), c=document.createElement('canvas');
    c.width=cw;c.height=ch;
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(src,0,0,cw,ch);
    return {url:c.toDataURL('image/jpeg',0.86),w:cw,h:ch};
  }
  function addFiles(files,sectionId){
    var sec=findSection(sectionId); if(!sec) return;
    var list=Array.prototype.slice.call(files).filter(function(f){return f.type.indexOf('image/')===0||/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)});
    if(!list.length){say('Those files are not photos. Drop JPG, PNG or WebP images.');return}
    var bad=[], chain=Promise.resolve();
    list.forEach(function(f){
      chain=chain.then(function(){return loadBitmap(f)}).then(function(src){
        var r=shrink(src);
        sec.photos.push({id:nextId(),name:f.name,url:r.url,w:r.w,h:r.h,caption:''});
      }).catch(function(){bad.push(f.name)});
    });
    chain.then(function(){
      render();
      if(bad.length) say('Could not open '+bad.join(', ')+'. This browser cannot read that format, so export it as JPG first.');
      else say(list.length+' photo'+(list.length===1?'':'s')+' added. Write a caption under each one.',true);
    });
  }

  /* ---------- rendering ---------- */
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

  function movePhoto(pid,toSectionId,beforePid){
    var f=findPhoto(pid), to=findSection(toSectionId); if(!f||!to) return;
    var p=f.s.photos.splice(f.i,1)[0];
    var idx=to.photos.length;
    if(beforePid){for(var i=0;i<to.photos.length;i++) if(to.photos[i].id===beforePid){idx=i;break}}
    to.photos.splice(idx,0,p);
    render();
  }
  function nudge(sec,i,d){
    var j=i+d; if(j<0||j>=sec.photos.length) return;
    var t=sec.photos[i];sec.photos[i]=sec.photos[j];sec.photos[j]=t;render();
  }

  function renderCard(sec,p,i){
    var c=el('div','card');c.draggable=window.matchMedia&&window.matchMedia('(pointer:fine)').matches;c.dataset.pid=p.id;
    var th=el('div','thumb');var im=el('img');im.src=p.url;im.alt=p.caption||p.name;im.draggable=false;th.appendChild(im);
    var body=el('div','cbody');
    var cap=el('input');cap.type='text';cap.value=p.caption;cap.placeholder='Add a caption';
    cap.setAttribute('aria-label','Caption for '+p.name);
    cap.addEventListener('input',function(){p.caption=cap.value});
    cap.addEventListener('dragstart',function(e){e.stopPropagation()});
    var row=el('div','crow');
    var left=el('div');left.style.display='flex';left.style.gap='4px';
    var b1=el('button','btn small','Earlier');b1.type='button';b1.disabled=i===0;b1.addEventListener('click',function(){nudge(sec,i,-1)});
    var b2=el('button','btn small','Later');b2.type='button';b2.disabled=i===sec.photos.length-1;b2.addEventListener('click',function(){nudge(sec,i,1)});
    left.appendChild(b1);left.appendChild(b2);
    var rm=el('button','btn small warn','Remove');rm.type='button';
    rm.addEventListener('click',function(){var f=findPhoto(p.id);if(f){f.s.photos.splice(f.i,1);render()}});
    row.appendChild(left);row.appendChild(rm);
    body.appendChild(cap);body.appendChild(row);
    c.appendChild(th);c.appendChild(body);
    c.addEventListener('dragstart',function(e){dragging=p.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','card')}catch(_){}});
    c.addEventListener('dragend',function(){dragging=null;c.classList.remove('dragging')});
    c.addEventListener('dragover',function(e){if(dragging){e.preventDefault();c.classList.add('target')}});
    c.addEventListener('dragleave',function(){c.classList.remove('target')});
    c.addEventListener('drop',function(e){
      c.classList.remove('target');
      if(dragging&&dragging!==p.id){e.preventDefault();e.stopPropagation();movePhoto(dragging,sec.id,p.id)}
    });
    return c;
  }

  function renderSection(sec){
    var box=el('section','section');
    var head=el('div','shead');
    var t=el('input');t.type='text';t.value=sec.title;t.placeholder='Section heading, e.g. Our wedding';t.setAttribute('aria-label','Section heading');
    t.addEventListener('input',function(){sec.title=t.value});
    var n=Math.ceil(sec.photos.length/4);
    var pill=el('span','pill',sec.photos.length+(sec.photos.length===1?' photo':' photos')+(n?' · '+n+(n===1?' page':' pages'):''));
    var del=el('button','btn small warn','Remove section');del.type='button';
    var armed=false;
    del.addEventListener('click',function(){
      if(sec.photos.length&&!armed){armed=true;del.textContent='Click again to remove '+sec.photos.length+' photos';return}
      state.sections=state.sections.filter(function(s){return s!==sec});render();
    });
    head.appendChild(t);head.appendChild(pill);head.appendChild(del);

    var drop=el('label','drop');
    var inp=el('input');inp.type='file';inp.multiple=true;inp.accept='image/*,.heic,.heif';
    drop.appendChild(el('strong',null,'Drop photos here'));
    drop.appendChild(el('span',null,'or tap to choose from your files'));
    drop.appendChild(inp);
    inp.addEventListener('change',function(){addFiles(inp.files,sec.id);inp.value=''});
    drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('over')});
    drop.addEventListener('dragleave',function(){drop.classList.remove('over')});
    drop.addEventListener('drop',function(e){
      e.preventDefault();drop.classList.remove('over');
      if(dragging){movePhoto(dragging,sec.id,null);return}
      if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length) addFiles(e.dataTransfer.files,sec.id);
    });

    box.appendChild(head);box.appendChild(drop);
    if(sec.photos.length){
      var g=el('div','grid');
      sec.photos.forEach(function(p,i){g.appendChild(renderCard(sec,p,i))});
      box.appendChild(g);
      box.appendChild(el('div','hint','Drag a photo onto another one to reorder it, or onto another section to move it.'));
    }
    return box;
  }

  function render(){
    var host=$('sections');host.textContent='';
    state.sections.forEach(function(s){host.appendChild(renderSection(s))});
    renderParts();
    updateStatus();
  }

  $('addSection').addEventListener('click',function(){
    state.sections.push({id:nextId(),title:'New section',photos:[]});render();
    var all=document.querySelectorAll('.section .shead input');var last=all[all.length-1];if(last){last.focus();last.select()}
  });

  /* ---------- PDF ---------- */
  function buildPdf(){
    var J=window.jspdf&&window.jspdf.jsPDF; if(!J) throw new Error('lib');
    var doc=new J({unit:'mm',format:'a4'});
    var M=18, W=210, gap=8, cw=(W-2*M-gap)/2, ih=98, capH=14, rowGap=6, firstPage=true;
    doc.setProperties({title:state.title||'Photo sheet'});
    state.sections.forEach(function(sec){
      for(var s=0;s<sec.photos.length;s+=4){
        if(!firstPage) doc.addPage();
        var y=M;
        if(firstPage){
          doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(23,32,46);
          doc.text(state.title||'',M,y+6);y+=9;
          if(state.subtitle){doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(95,104,120);doc.text(state.subtitle,M,y+4);y+=8}
          y+=2;
        }
        doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(23,32,46);
        doc.text(sec.title||'',M,y+5);y+=11;
        sec.photos.slice(s,s+4).forEach(function(p,i){
          var x=M+(i%2)*(cw+gap), top=y+Math.floor(i/2)*(ih+capH+rowGap);
          var k=Math.min(cw/p.w,ih/p.h), dw=p.w*k, dh=p.h*k;
          doc.setFont('helvetica','normal');doc.setFontSize(9.5);
          var lines=doc.splitTextToSize(p.caption||'',cw).slice(0,2);
          var block=dh+(lines.length?lines.length*4.2+2.5:0);
          var iy=top+(ih+capH-block)/2;
          doc.addImage(p.url,'JPEG',x+(cw-dw)/2,iy,dw,dh,undefined,'FAST');
          if(lines.length){
            doc.setTextColor(40,48,62);
            doc.text(lines,x+cw/2,iy+dh+5,{align:'center'});
          }
        });
        firstPage=false;
      }
    });
    return doc.output('blob');
  }

  function anchorSave(blob,name){
    var u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=name+'.pdf';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},60000);
    return 'saved';
  }
  function saveBlob(blob,name){
    var file=null;
    try{file=new File([blob],name+'.pdf',{type:'application/pdf'})}catch(_){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:name}).then(function(){return 'shared'}).catch(function(err){
        if(err&&err.name==='AbortError') throw err;
        return anchorSave(blob,name);
      });
    }
    return Promise.resolve(anchorSave(blob,name));
  }

  /* ---------- combining several PDFs ---------- */
  function visibleOrder(){
    return state.order.filter(function(id){return id!=='live'||photoCount()>0});
  }
  function partById(id){return state.parts.filter(function(p){return p.id===id})[0]}
  function moveOrder(id,d){
    var vis=visibleOrder(), i=vis.indexOf(id), j=i+d;
    if(i<0||j<0||j>=vis.length) return;
    var a=state.order.indexOf(vis[i]), b=state.order.indexOf(vis[j]);
    var t=state.order[a];state.order[a]=state.order[b];state.order[b]=t;
    renderParts();updateStatus();
  }
  function renderParts(){
    var host=$('parts');host.textContent='';
    var vis=visibleOrder();
    if(!vis.length){host.appendChild(el('div','hint2','Nothing here yet. Add photos above, or add PDFs.'));return}
    vis.forEach(function(id,i){
      var live=id==='live', part=live?null:partById(id);
      var row=el('div','part');
      var info=el('div','pinfo');
      info.appendChild(el('div','pname',live?('Photo sheet'+(state.title?': '+state.title:'')):part.name));
      info.appendChild(el('div','hint2',live?(photoCount()+' photos, '+livePages()+' pages (from the sections above)'):(part.pages+(part.pages===1?' page':' pages')+(part.kind==='sheet'?', finished photo sheet':', added PDF'))));
      var btns=el('div','crow');
      var l=el('div');l.style.display='flex';l.style.gap='4px';
      var e=el('button','btn small','Earlier');e.type='button';e.disabled=i===0;e.addEventListener('click',function(){moveOrder(id,-1)});
      var t=el('button','btn small','Later');t.type='button';t.disabled=i===vis.length-1;t.addEventListener('click',function(){moveOrder(id,1)});
      l.appendChild(e);l.appendChild(t);btns.appendChild(l);
      if(!live){
        var r=el('button','btn small warn','Remove');r.type='button';
        r.addEventListener('click',function(){
          state.parts=state.parts.filter(function(p){return p.id!==id});
          state.order=state.order.filter(function(x){return x!==id});
          renderParts();updateStatus();
        });
        btns.appendChild(r);
      }
      row.appendChild(info);row.appendChild(btns);host.appendChild(row);
    });
  }
  function addPdfFiles(files){
    var list=Array.prototype.slice.call(files).filter(function(f){return f.type==='application/pdf'||/\.pdf$/i.test(f.name)});
    if(!list.length){say('Those files are not PDFs.');return}
    var PL=window.PDFLib; if(!PL){say('The PDF tools did not load. Reload the page and try again.');return}
    var bad=[], chain=Promise.resolve();
    list.forEach(function(f){
      chain=chain.then(function(){return f.arrayBuffer()}).then(function(buf){
        return PL.PDFDocument.load(buf,{ignoreEncryption:true}).then(function(d){
          var id=nextId();
          state.parts.push({id:id,name:f.name,bytes:new Uint8Array(buf),pages:d.getPageCount(),kind:'pdf'});
          state.order.push(id);
        });
      }).catch(function(){bad.push(f.name)});
    });
    chain.then(function(){
      renderParts();updateStatus();
      if(bad.length) say('Could not open '+bad.join(', ')+'. It may be damaged or password protected.');
      else say(list.length+' PDF'+(list.length===1?'':'s')+' added.',true);
    });
  }
  (function(){
    var inp=$('pdfInput'), drop=inp.parentNode;
    inp.addEventListener('change',function(){addPdfFiles(inp.files);inp.value=''});
    drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('over')});
    drop.addEventListener('dragleave',function(){drop.classList.remove('over')});
    drop.addEventListener('drop',function(e){
      e.preventDefault();drop.classList.remove('over');
      if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length) addPdfFiles(e.dataTransfer.files);
    });
  })();
  $('freeze').addEventListener('click',function(){
    if(!photoCount()){say('Add some photos to this sheet first.');return}
    var blob;
    try{blob=buildPdf()}catch(e){say('Could not build the sheet. Reload the page and try again.');return}
    var name=(state.title||'Photo sheet').trim()||'Photo sheet', pages=pageCount();
    blob.arrayBuffer().then(function(buf){
      var id=nextId();
      state.parts.push({id:id,name:name,bytes:new Uint8Array(buf),pages:pages,kind:'sheet'});
      state.order.splice(state.order.indexOf('live'),0,id);
      state.sections=[{id:nextId(),title:'',photos:[]}];
      $('docTitle').value='';$('docSub').value='';state.title='';state.subtitle='';
      render();
      say('Sheet saved to the bundle. Start the next one above.',true);
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });
  function assemble(){
    var PL=window.PDFLib, out, chain;
    return PL.PDFDocument.create().then(function(o){
      out=o;chain=Promise.resolve();
      visibleOrder().forEach(function(id){
        chain=chain.then(function(){
          if(id==='live') return buildPdf().arrayBuffer();
          return partById(id).bytes;
        }).then(function(bytes){
          return PL.PDFDocument.load(bytes,{ignoreEncryption:true});
        }).then(function(src){
          return out.copyPages(src,src.getPageIndices());
        }).then(function(pages){pages.forEach(function(p){out.addPage(p)})});
      });
      return chain;
    }).then(function(){return out.save()}).then(function(bytes){return new Blob([bytes],{type:'application/pdf'})});
  }

  function anchorSave(blob,name){
    var u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=name+'.pdf';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},60000);
    return 'saved';
  }
  function saveBlob(blob,name){
    var file=null;
    try{file=new File([blob],name+'.pdf',{type:'application/pdf'})}catch(_){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:name}).then(function(){return 'shared'}).catch(function(err){
        if(err&&err.name==='AbortError') throw err;
        return anchorSave(blob,name);
      });
    }
    return Promise.resolve(anchorSave(blob,name));
  }

  $('make').addEventListener('click',function(){
    if(busy||!totalPages()) return;
    var missing=0;state.sections.forEach(function(s){s.photos.forEach(function(p){if(!p.caption.trim())missing++})});
    busy=true;updateStatus();say('Building the PDF…',true);
    setTimeout(function(){
      var made;
      try{made=state.parts.length?assemble():Promise.resolve(buildPdf())}catch(e){made=Promise.reject(e)}
      made.then(function(blob){
        var name=(state.filename||'Photo_Sheet').replace(/[\\/:*?"<>|]+/g,'').replace(/\.pdf$/i,'').trim()||'Photo_Sheet';
        return saveBlob(blob,name);
      }).then(function(how){
        busy=false;updateStatus();
        say((how==='shared'?'Shared. Choose Save to Files to keep it.':'Saved.')+(missing?' '+missing+' photo'+(missing===1?' has':'s have')+' no caption.':''),true);
      }).catch(function(err){
        busy=false;updateStatus();
        say(err&&err.name==='AbortError'?'Not saved. Press Make PDF again when you are ready.':'Could not build or save the PDF. Reload the page and try again.');
      });
    },30);
  });

  render();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
